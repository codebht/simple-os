plugins { id 'com.android.application' }

android {
    namespace 'com.simple.provision'
    compileSdk 34
    defaultConfig {
        applicationId 'com.simple.provision'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
