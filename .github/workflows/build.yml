name: build-apks
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - run: gradle :home:assembleRelease :provision:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            home/build/outputs/apk/release/*.apk
            provision/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            home/build/outputs/apk/release/home-release.apk
            provision/build/outputs/apk/release/provision-release.apk
